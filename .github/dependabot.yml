version: 2

# A project whose CI runs pip-audit and Trivy should not then sit on stale
# dependencies for months. Weekly is frequent enough to matter and rare enough
# not to drown the repository in pull requests.

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
    labels:
      - dependencies
      - python

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(web)"
      include: scope
    labels:
      - dependencies
      - frontend
    groups:
      # three, react and tailwind each move as a set; separate PRs for
      # @types/three and three guarantee a broken intermediate state.
      three:
        patterns:
          - "three"
          - "@types/three"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
          - "@vitejs/plugin-react"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci
