name: pages

# The public demo. Pages serves the console as static files reading the
# tracked artifacts/*.json - the same numbers the README quotes, so the demo
# cannot drift from the paper.
#
# Hugging Face made Docker Spaces PRO-only on 8 July 2026, so the free demo
# lives here. Dockerfile.space remains the full-fidelity path - console plus
# the authenticated /v1 API - for a local docker build or a paid Space.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys with an OIDC token. Nothing here may write to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling them, so the newest push wins rather
# than the fastest one. This is the opposite of the ci workflow on purpose.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No cache: key. setup-node fails the whole job when
          # cache-dependency-path resolves to no file, which turns a
          # caching optimisation into a deploy outage. This install is
          # ~15s cold; that is not worth a failure mode.

      # Printed before the install so a failure here is diagnosable from the
      # log alone. The first version of this job failed in 19 seconds and
      # said nothing about which of these was wrong.
      - name: environment
        run: |
          node --version
          npm --version
          ls -l web/package.json web/package-lock.json

      # npm ci is the default: it installs the exact locked tree. If the
      # lockfile has drifted from package.json it refuses, and for a demo
      # deploy a resolvable install beats a red cross - so it falls back,
      # loudly. The warning is deliberate: a drifted lockfile is a real
      # problem, it is just not a reason to take the site down.
      - name: install
        working-directory: web
        run: |
          if npm ci --no-audit --fund=false; then
            echo "locked tree installed"
          else
            echo "::warning::npm ci failed; the lockfile and package.json"\
                 " have drifted. Falling back to npm install. Commit the"\
                 " regenerated web/package-lock.json to restore reproducibility."
            npm install --no-audit --fund=false
          fi

      # Exits 1 if any required artifact is missing. There is no mock data
      # anywhere in this app, so a missing artifact must fail the deploy
      # rather than publish an empty panel.
      - name: copy measured artifacts into the bundle
        working-directory: web
        run: node scripts/sync-artifacts.mjs ../artifacts

      # check-css, then tsc --noEmit, then vite build. The typecheck is a
      # deployment gate: a type error cannot reach the live site.
      - name: build
        working-directory: web
        run: npm run build

      - name: disable jekyll
        run: touch web/dist/.nojekyll

      # enablement: true turns Pages on via the API if it has not been
      # switched on in Settings, instead of failing with 'Get Pages site
      # failed'. A deploy workflow that requires an undocumented click is a
      # deploy workflow that breaks for the next person who clones this.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
